<!doctype html>
<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>وضعیت سیستم‌ها</title>
<style>
@font-face { font-family: Vazirmatn; src: url("vazirmatn.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #F3F6FB; --card: #FFFFFF; --ink: #0F1B33; --muted: #5B6880; --line: #E3E8F1;
  --ok: #1FA971; --warn: #B96A0C; --bad: #E0453F; --idle: #98A2B3; --accent: #0D6FCB;
  --ok-bg: #E7F6EF; --warn-bg: #FBF0E1; --bad-bg: #FCE9E8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B1324; --card: #131D33; --ink: #EAF0FB; --muted: #94A3BD; --line: #22304D;
    --ok: #34C98C; --warn: #F2A93B; --bad: #FF6B64; --idle: #5B6880; --accent: #3AA0FF;
    --ok-bg: #12332A; --warn-bg: #3A2C14; --bad-bg: #3D1C1D;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: Vazirmatn, Tahoma, system-ui, sans-serif; font-size: 15px; line-height: 1.6;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
.wrap { max-width: 560px; margin: 0 auto; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 20px; margin: 0; font-weight: 800; }
.sub { color: var(--muted); font-size: 12.5px; }
button.refresh { font: inherit; font-weight: 700; font-size: 14px; border: 0; border-radius: 12px; padding: 9px 16px;
  background: var(--accent); color: #fff; cursor: pointer; flex-shrink: 0; }
button.refresh:disabled { opacity: .55; }

.summary { border-radius: 16px; padding: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); }
.summary .big { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
  font-size: 22px; color: #fff; background: var(--idle); }
.summary.ok   { background: var(--ok-bg);   border-color: transparent; } .summary.ok .big   { background: var(--ok); }
.summary.warn { background: var(--warn-bg); border-color: transparent; } .summary.warn .big { background: var(--warn); }
.summary.bad  { background: var(--bad-bg);  border-color: transparent; } .summary.bad .big  { background: var(--bad); }
.summary b { display: block; font-size: 17px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 14px; overflow: hidden; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 16px 6px; }
.card-h h2 { font-size: 15.5px; margin: 0; font-weight: 800; }
.card-h a { font-size: 12.5px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.card-h + .row { border-top: 0; }
.dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; background: var(--idle); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.info { background: var(--accent); }
.dot.maint { background: var(--idle); }
.badge { font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 1px 6px; margin-inline-start: 6px; }
.sw-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
.card-h + .sw-row { border-top: 0; }
.sw-row .grow { flex: 1; min-width: 0; }
.switch { position: relative; width: 50px; height: 30px; flex-shrink: 0; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 15px; background: var(--bad); transition: background .2s; }
.switch .knob { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track .knob { transform: translateX(-20px); }
.switch input:disabled + .track { opacity: .5; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot.wait { background: var(--idle); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
.row .name { font-weight: 600; }
.row .detail { color: var(--muted); font-size: 12.5px; word-break: break-word; }
.row .detail.bad { color: var(--bad); } .row .detail.warn { color: var(--warn); }
.tunnel { font-size: 12px; color: var(--muted); padding: 0 16px 12px; direction: ltr; text-align: left; word-break: break-all; }
.hidden { display: none !important; }
.login { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; margin-top: 8vh; }
.login h1 { margin-bottom: 4px; }
.login label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
.login input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); direction: ltr; text-align: left; }
.login button { width: 100%; margin-top: 18px; padding: 12px; }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 1em; }
.user { display: flex; justify-content: center; gap: 8px; align-items: center; }
.link-btn { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<script>
/* ================== تنظیمات ================== */
// همه‌ی برنامه‌ها روی دامنه‌ی issueteam.ir (همون سایتی که این صفحه روشه)؛ آدرس‌های github.io هم به همین‌جا ریدایرکت می‌شن
const PAGES = /(^|\.)issueteam\.ir$/.test(location.hostname) ? location.origin : "http://issueteam.ir";
const SUPABASE_URL = "https://paokcjakxxjqtulibegi.supabase.co";
const SUPABASE_KEY = "sb_publishable_Us07X7VRGQ4q3jSIPzeT0g_8-qkLTeO";   // همون کلید عمومی هاب
const USERNAME_EMAIL_DOMAIN = "bimename.com";                         // مثل هاب: نام کاربری@bimename.com
const TIMEOUT_MS = 12000;
const AUTO_REFRESH_MS = 2 * 60 * 1000;

// آستانه‌ها به دقیقه: [تا این‌قدر سبز، تا این‌قدر زرد، بعدش قرمز]
const LIMITS = {
  ops:    [25, 45],    // وضعیت پنل کارشناسان (هر ۱۵ دقیقه)
};

/* ================== ابزارها ================== */
const $ = id => document.getElementById(id);
const fa = s => String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function ago(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return "همین الان";
  if (m < 60) return fa(m) + " دقیقه پیش";
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return fa(h) + " ساعت" + (r ? " و " + fa(r) + " دقیقه" : "") + " پیش";
  return fa(Math.floor(h / 24)) + " روز پیش";
}

async function timedFetch(url, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  const t0 = performance.now();
  try {
    const r = await fetch(url, { cache: "no-store", ...opts, signal: ctrl.signal });
    return { r, ms: Math.round(performance.now() - t0) };
  } finally { clearTimeout(t); }
}

// تاریخ شمسی → میلادی (الگوریتم استاندارد jalaali)
function j2g(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
  let gy = 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const ml = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm; for (gm = 0; gm < 13 && gd > ml[gm]; gm++) gd -= ml[gm];
  return [gy, gm, gd];
}
// "1405/08/17" + "19:08" (ساعت تهران) → زمان میلادی به میلی‌ثانیه
function tehranJalaliToMs(date, time) {
  const d = String(date || "").replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  const t = String(time || "").replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).match(/(\d{1,2}):(\d{2})/);
  if (!d || !t) return null;
  const [gy, gm, gd] = j2g(+d[1], +d[2], +d[3]);
  return Date.UTC(gy, gm - 1, gd, +t[1], +t[2]) - 3.5 * 3600 * 1000;   // تهران = UTC+03:30
}
function freshness(ageMs, [okMin, warnMin]) {
  const m = ageMs / 60000;
  return m <= okMin ? "ok" : m <= warnMin ? "warn" : "bad";
}

/* ================== بررسی‌ها ================== */
// بالا بودن صفحه‌ی گیت‌هاب
async function checkPage(path) {
  try {
    const { r, ms } = await timedFetch(PAGES + path);
    return r.ok ? { s: "ok", d: "در دسترس · " + fa(ms) + " میلی‌ثانیه" } : { s: "bad", d: "خطای " + fa(r.status) };
  } catch (e) { return { s: "bad", d: "باز نشد" }; }
}

// آدرس فعلی تونل از config.js همون ریپو
async function readTunnel(repo) {
  // اول از Supabase (همون جایی که خود برنامه‌ها آدرس تونل رو اول ازش می‌خونن و فوری آپدیت می‌شه)
  const fromSb = HB && HB["tunnel_" + repo];
  if (fromSb && /^https:\/\//.test(fromSb)) return fromSb.replace(/\/+$/, "");
  // پشتیبان: config.js همون برنامه
  try {
    const { r } = await timedFetch(`${PAGES}/${repo}/config.js?t=${Date.now()}`);
    const m = (await r.text()).match(/API_BASE\s*:\s*["']([^"']+)["']/);
    return m ? m[1].replace(/\/+$/, "") : null;
  } catch (e) { return null; }
}
const tunnelChangedAt = repo => (HB && HB["tunnel_" + repo + "_at"]) ? Date.parse(HB["tunnel_" + repo + "_at"]) : null;

// پینگ یک سرویس پشت تونل:
// هر جوابی از خود سرور (حتی ۴۰۱ «لاگین لازمه» یا ۴۰۵) یعنی زنده‌ست؛ ۵۰۲/۵۰۳/۵۰۴ یعنی گیت‌وی بالاست ولی سرویس نه.
async function probe(url, opts) {
  try {
    const { r, ms } = await timedFetch(url, opts);
    if ([502, 503, 504].includes(r.status)) return { s: "bad", d: "سرویس بالا نیست (" + fa(r.status) + ")" };
    if (r.status === 404) return { s: "warn", d: "مسیر پیدا نشد (۴۰۴) — شاید تونل عوض شده" };
    return { s: "ok", d: "جواب داد · " + fa(ms) + " میلی‌ثانیه" };
  } catch (e) {
    return { s: "bad", d: e.name === "AbortError" ? "جواب نداد (تایم‌اوت)" : "جواب نداد — سیستم یا cmd خاموشه؟" };
  }
}

async function checkDashboard() {
  const api = await readTunnel("dashboard");
  const rows = [{ name: "صفحه‌ی داشبورد", app: "dashboard", ...(await checkPage("/dashboard/")) }];
  if (!api) {
    rows.push({ name: "سرور (cmd داشبورد)", app: "dashboard", s: "bad", d: "آدرس تونل توی config.js پیدا نشد" });
    return { rows, api };
  }
  const gw = await probe(api + "/auth/health");
  rows.push({ name: "سرور + لاگین (cmd داشبورد)", app: "dashboard", ...gw });
  if (gw.s === "bad") {
    for (const [n, app] of [["تاریخچه‌خوان", "tarikhche"], ["الحاقیه ایران", "dashboard"], ["آمار درخواست‌ها", "dashboard"]]) rows.push({ name: n, app, s: "bad", d: "سرور اصلی بالا نیست" });
  } else {
    const [t, e, s] = await Promise.all([
      probe(api + "/tarikhche/api/ping"),
      probe(api + "/endorsement/api/endorsement/search"),
      probe(api + "/stats/api/summary?days=1"),
    ]);
    rows.push({ name: "تاریخچه‌خوان", app: "tarikhche", ...t }, { name: "الحاقیه ایران", app: "dashboard", ...e }, { name: "آمار درخواست‌ها", app: "dashboard", ...s });
  }
  return { rows, api };
}

async function checkSanhab() {
  const api = await readTunnel("sanhab");
  const rows = [{ name: "صفحه‌ی سنهاب", app: "sanhab", ...(await checkPage("/sanhab/")) }];
  if (!api) rows.push({ name: "سرور (cmd سنهاب)", app: "sanhab", s: "bad", d: "آدرس تونل توی config.js پیدا نشد" });
  else rows.push({ name: "سرور (cmd سنهاب)", app: "sanhab", ...(await probe(api + "/api/me")) });
  return { rows, api };
}

// heartbeat یک بار در هر بررسی گرفته می‌شه: زمان‌های n8n + وضعیت کلیدهای تعمیر
let HB = null, HB_ROW = null, MAINT = {};
async function fetchHeartbeat() {
  HB = null;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const { r, ms } = await timedFetch(SUPABASE_URL + "/rest/v1/rpc/status_heartbeat", {
      method: "POST", body: "{}",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session.access_token } : {}) },
    });
    if (!r.ok) { HB_ROW = { name: "Supabase", s: "bad", d: "خطای " + fa(r.status) }; return; }
    HB = await r.json();
    MAINT = HB.maintenance || {};
    HB_ROW = { name: "Supabase", s: "ok", d: "در دسترس · " + fa(ms) + " میلی‌ثانیه" };
  } catch (e) { HB_ROW = { name: "Supabase", s: "bad", d: "جواب نداد" }; }
}
const isOff = app => !!(MAINT[app] && MAINT[app].on);

async function checkWallboard() {
  return { rows: [{ name: "صفحه‌ی وال برد", app: "wallboard", ...(await checkPage("/wallboard/")) }] };
}

async function checkHub() {
  const rows = [];
  // صفحه + نسخه
  try {
    // ریپوی هاب به azkicenter تغییر نام داده؛ تا وقتی آدرس جدید جواب نداده، آدرس قدیمی رو هم امتحان می‌کنه
    let { r, ms } = await timedFetch(`${PAGES}/azkicenter/version.txt?t=${Date.now()}`);
    if (!r.ok) { const old = await timedFetch(`${PAGES}/hub/version.txt?t=${Date.now()}`); if (old.r.ok) ({ r, ms } = old); }
    rows.push(r.ok
      ? { name: "صفحه‌ی هاب", app: "hub", s: "ok", d: "نسخه‌ی \u2066" + fa((await r.text()).trim()) + "\u2069 · " + fa(ms) + " میلی‌ثانیه" }
      : { name: "صفحه‌ی هاب", app: "hub", s: "bad", d: "خطای " + fa(r.status) });
  } catch (e) { rows.push({ name: "صفحه‌ی هاب", app: "hub", s: "bad", d: "باز نشد" }); }

  // Supabase + تازگی دیتا (از همون heartbeat اول بررسی)
  rows.push(HB_ROW);
  const hb = HB;
  if (!hb) {
    for (const n of ["آپدیت ساعتی (n8n)", "آپدیت گزارش‌ها (n8n)", "توکن ازکی‌ایجنت", "وضعیت پنل کارشناسان (n8n)"]) rows.push({ name: n, s: "warn", d: "نامشخص — Supabase در دسترس نیست" });
    return { rows };
  }

  const now = Date.parse(hb.now) || Date.now();     // ساعت سرور، نه ساعت گوشی
  const fresh = (name, at, lim, label) => {
    if (!at) return { name, s: "warn", d: "زمان آپدیت پیدا نشد" };
    const age = now - at, s = freshness(age, lim);
    return { name, s, d: "آخرین آپدیت " + ago(age) + (label ? " · " + label : "") + (s === "ok" ? "" : " — n8n یا سیستم رو چک کن") };
  };
  // آپدیت ساعتی: فقط زمان آخرین اجرا رو نشون می‌ده، هشدار نمی‌ده
  const lastRun = (name, date, time) => {
    const at = tehranJalaliToMs(date, time);
    return { name, s: "info", d: at ? "آخرین اجرا ساعت " + fa(time) + " · " + ago(now - at) : "زمان اجرا پیدا نشد" };
  };
  rows.push(lastRun("آپدیت ساعتی (n8n)", hb.app_date, hb.app_time));
  rows.push(lastRun("آپدیت گزارش‌ها (n8n)", hb.reports_date, hb.reports_time));
  // توکن ازکی‌ایجنت (جدول agent_token؛ اکستنشن کروم آپدیتش می‌کنه) — workflow پنل کارشناسان بدون اون کار نمی‌کنه
  const texp = hb.token_exp ? Date.parse(hb.token_exp) : null;
  const tupd = hb.token_updated_at ? Date.parse(hb.token_updated_at) : null;
  const left = texp ? texp - now : -1;
  const hhmm = ms => fa(new Date(ms).toLocaleTimeString("en-GB", { timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit" }));
  const dayT = ms => new Date(ms).toLocaleDateString("en-GB", { timeZone: "Asia/Tehran" });
  const inLeft = ms => { const m = Math.round(ms / 60000); return m < 60 ? fa(m) + " دقیقه" : fa(Math.floor(m / 60)) + " ساعت" + (m % 60 ? " و " + fa(m % 60) + " دقیقه" : ""); };
  const tokUpd = tupd ? " · آپدیت شده " + ago(now - tupd) + (hb.token_source === "chrome-extension" ? " (اکستنشن)" : "") : "";
  const tok = !texp
    ? { name: "توکن ازکی‌ایجنت", s: "bad", d: "توکنی ثبت نشده — با دکمه‌ی «آپدیت توکن» اکستنشن ثبتش کن" }
    : left <= 0
      ? { name: "توکن ازکی‌ایجنت", s: "bad", d: "منقضی شده (" + ago(-left).replace(" پیش", "") + " پیش) — با دکمه‌ی «آپدیت توکن» اکستنشن عوضش کن" + tokUpd }
      : { name: "توکن ازکی‌ایجنت", s: left < 2 * 3600e3 ? "warn" : "ok",
          d: "معتبر تا " + (dayT(texp) !== dayT(now) ? "فردا " : "") + "ساعت " + hhmm(texp) + " (" + inLeft(left) + " دیگه)" + (left < 2 * 3600e3 ? " — به‌زودی منقضی می‌شه" : "") + tokUpd };
  rows.push(tok);

  const ops = fresh("وضعیت پنل کارشناسان (n8n)", hb.ops_updated_at ? Date.parse(hb.ops_updated_at) : null, LIMITS.ops);
  if (ops.s !== "ok") {
    ops.d = ops.d.replace(" — n8n یا سیستم رو چک کن", "") + (tok.s === "bad"
      ? " — به‌خاطر توکن ازکی‌ایجنت"
      : " — توکن معتبره؛ Executions ورک‌فلو Panel Status توی n8n رو چک کن");
  }
  rows.push(ops);
  return { rows };
}

/* ================== نمایش ================== */
const GROUPS = [
  { id: "dashboard", title: "داشبورد عملیات", link: PAGES + "/dashboard/", run: checkDashboard, repo: "dashboard",
    pending: ["صفحه‌ی داشبورد", "سرور + لاگین (cmd داشبورد)", "تاریخچه‌خوان", "الحاقیه ایران", "آمار درخواست‌ها"] },
  { id: "sanhab", title: "سنهاب", link: PAGES + "/sanhab/", run: checkSanhab, repo: "sanhab",
    pending: ["صفحه‌ی سنهاب", "سرور (cmd سنهاب)"] },
  { id: "hub", title: "هاب ازکی سنتر", link: PAGES + "/azkicenter/", run: checkHub,
    pending: ["صفحه‌ی هاب", "Supabase", "آپدیت ساعتی (n8n)", "آپدیت گزارش‌ها (n8n)", "توکن ازکی‌ایجنت", "وضعیت پنل کارشناسان (n8n)"] },
  { id: "wallboard", title: "وال برد", link: PAGES + "/wallboard/", run: checkWallboard,
    pending: ["صفحه‌ی وال برد"] },
];

// برنامه‌هایی که کلید خاموش/روشن دارن (همون اسم‌هایی که توی Supabase و gate.js استفاده می‌شه)
const APPS = [
  { id: "hub",       title: "هاب ازکی سنتر" },
  { id: "dashboard", title: "داشبورد عملیات (کل داشبورد)" },
  { id: "tarikhche", title: "تاریخچه‌خوان" },
  { id: "sanhab",    title: "استعلام سنهاب" },
  { id: "wallboard", title: "وال برد" },
];

function renderSwitches() {
  const rows = APPS.map(a => {
    const m = MAINT[a.id] || {};
    const off = !!m.on;
    const who = m.at ? (off ? "خاموش شد " : "روشن شد ") + ago(Date.now() - Date.parse(m.at)) + (m.by ? " · " + m.by : "") : "روشن";
    return `<div class="sw-row">
      <div class="grow"><div class="name">${esc(a.title)}${off ? '<span class="badge">در حال تعمیر</span>' : ""}</div>
        <div class="detail">${esc(who)}</div></div>
      <label class="switch" title="${off ? "روشن کردن" : "خاموش کردن (نمایش صفحه‌ی در حال تعمیر)"}">
        <input type="checkbox" data-app="${a.id}" ${off ? "" : "checked"} ${HB ? "" : "disabled"} aria-label="${esc(a.title)}">
        <span class="track"><span class="knob"></span></span>
      </label></div>`;
  }).join("");
  $("switches").innerHTML = `<div class="card-h"><h2>روشن / خاموش برنامه‌ها</h2></div>${rows}
    <div class="tunnel" dir="rtl" style="text-align:right">برنامه‌ی خاموش به‌جای صفحه‌ی خودش «در حال به‌روزرسانی» نشون می‌ده و مانیتور براش ایمیل قطعی نمی‌فرسته. برای تست حین تعمیر، آخر آدرسش <span dir="ltr">?bypass=1</span> بذار.</div>`;
}

$("switches").addEventListener("change", async e => {
  const inp = e.target.closest("input[data-app]");
  if (!inp) return;
  const app = inp.dataset.app, turnOff = !inp.checked;
  inp.disabled = true;
  const { error, data } = await sb.rpc("maintenance_set", { p_app: app, p_on: turnOff });
  if (error) {
    inp.checked = !inp.checked;
    inp.disabled = false;
    const d = inp.closest(".sw-row").querySelector(".detail");
    d.textContent = "عوض نشد: " + (error.code === "42501" ? "فقط سرپرست‌ها اجازه دارن" : (error.message || "خطا"));
    d.className = "detail bad";
    return;
  }
  MAINT = data || MAINT;
  renderSwitches();
  runAll();
});
const tunnelInfo = {};   // repo → { api, changedAt }

function renderCard(g, rows) {
  const t = tunnelInfo[g.repo];
  const tunnelLine = t && t.api
    ? `<div class="tunnel">${esc(t.api.replace(/^https?:\/\//, ""))}${t.changedAt ? " · <span dir=\"rtl\">آدرس تونل " + ago(Date.now() - t.changedAt) + " عوض شده</span>" : ""}</div>` : "";
  return `<section class="card" id="card-${g.id}">
    <div class="card-h"><h2>${esc(g.title)}</h2><a href="${g.link}" target="_blank" rel="noopener">باز کردن ↗</a></div>
    ${rows.map(r => `<div class="row"><span class="dot ${r.s}"></span><div><div class="name">${esc(r.name)}${r.s === "maint" ? '<span class="badge">خاموش</span>' : ""}</div>
      <div class="detail ${r.s === "bad" ? "bad" : r.s === "warn" ? "warn" : ""}">${esc(r.d || "")}</div></div></div>`).join("")}
    ${tunnelLine}
  </section>`;
}

let running = false;
async function runAll() {
  if (running) return;
  running = true;
  $("refreshBtn").disabled = true;
  $("checkedAt").textContent = "در حال بررسی…";
  $("cards").innerHTML = GROUPS.map(g => renderCard(g, g.pending.map(n => ({ name: n, s: "wait", d: "در حال بررسی…" })))).join("");

  // زمان عوض شدن تونل از GitHub API — حداکثر هر ۱۰ دقیقه یک بار (سقف ۶۰ درخواست در ساعت)
  await fetchHeartbeat();
  renderSwitches();

  const results = await Promise.all(GROUPS.map(async g => {
    let res;
    try { res = await g.run(); } catch (e) { res = { rows: [{ name: g.title, s: "bad", d: "خطای غیرمنتظره در بررسی" }] }; }
    // برنامه‌ی خاموش (حالت تعمیر): خطاهاش شمرده نمی‌شه
    const dashOff = isOff("dashboard");
    for (const r of res.rows) {
      if (r.app && (isOff(r.app) || (dashOff && r.app === "tarikhche"))) {
        r.d = "خاموش (حالت تعمیر)" + (r.s === "ok" ? "" : " · " + r.d);
        r.s = "maint";
      }
    }
    if (g.repo) tunnelInfo[g.repo] = { api: res.api, changedAt: tunnelChangedAt(g.repo) };
    $("card-" + g.id).outerHTML = renderCard(g, res.rows);
    return res.rows;
  }));

  const all = results.flat();
  const bad = all.filter(r => r.s === "bad").length, warn = all.filter(r => r.s === "warn").length;
  const sum = $("summary");
  sum.className = "summary " + (bad ? "bad" : warn ? "warn" : "ok");
  $("sumIcon").textContent = bad ? "!" : warn ? "؟" : "✓";
  $("sumTitle").textContent = bad ? fa(bad) + " مورد مشکل داره" : warn ? fa(warn) + " مورد نیاز به توجه" : "همه‌چیز سالمه";
  const checked = all.filter(r => r.s !== "info" && r.s !== "maint").length;
  $("sumText").textContent = fa(checked - bad - warn) + " از " + fa(checked) + " مورد سالم";
  document.title = (bad ? "🔴 " : warn ? "🟠 " : "🟢 ") + "وضعیت سیستم‌ها";
  $("checkedAt").textContent = "آخرین بررسی: " + fa(new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit" }));
  $("refreshBtn").disabled = false;
  running = false;
}

/* ================== ورود (همون حساب‌های هاب، فقط سرپرست) ================== */
// ورود با همون حساب‌های هاب (Supabase)؛ سشن توی همین مرورگر می‌مونه
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let timer = null;

function showLogin(msg) {
  clearInterval(timer); timer = null;
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("loginErr").textContent = msg || "";
}
async function enter(user) {
  const { data: profile, error } = await sb.from("profiles").select("role, full_name").eq("id", user.id).single();
  if (error || !profile) return showLogin("پروفایل پیدا نشد؛ دوباره وارد شو");
  if (profile.role !== "supervisor") { await sb.auth.signOut(); return showLogin("این صفحه فقط برای سرپرست‌هاست"); }
  $("userLabel").textContent = (profile.full_name || "").trim() || user.email.split("@")[0];
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  runAll();
  if (!timer) timer = setInterval(() => { if (!document.hidden) runAll(); }, AUTO_REFRESH_MS);
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true; $("loginBtn").textContent = "در حال ورود…";
  const username = $("username").value.replace(/\s+/g, "");
  const { data, error } = await sb.auth.signInWithPassword({
    email: username.includes("@") ? username : username + "@" + USERNAME_EMAIL_DOMAIN,
    password: $("password").value,
  });
  $("loginBtn").disabled = false; $("loginBtn").textContent = "ورود";
  if (error) return showLogin(/network|fetch|failed to/i.test(error.message || "") ? "اتصال به سرور برقرار نشد" : "نام کاربری یا رمز عبور اشتباه است");
  $("password").value = "";
  enter(data.user);
});
$("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); showLogin(); });
$("refreshBtn").addEventListener("click", () => runAll());
document.addEventListener("visibilitychange", () => { if (!document.hidden && timer) runAll(); });

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) enter(session.user); else showLogin();
})();
</script>
