name: monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # هر ۱۰ دقیقه (گیت‌هاب گاهی چند دقیقه دیرتر اجرا می‌کنه)
  workflow_dispatch:          # اجرای دستی از تب Actions
    inputs:
      test_email:
        description: "یه ایمیل تست هم بفرسته؟"
        type: boolean
        default: false

permissions:
  contents: write             # فقط برای ذخیره‌ی state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run checks
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python3 monitor.py

      - name: Save state
        if: always()        # حتی اگه ارسال ایمیل خطا داد، وضعیت ذخیره بشه
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "status-bot"
            git config user.email "status-bot@users.noreply.github.com"
            git add state.json
            git commit -m "monitor: update state [skip ci]"
            git push
          fi
